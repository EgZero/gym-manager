# =====================================================================
# GymManager · Nginx SOLO HTTP (usar mientras no haya dominio ni TLS)
# Destino: /etc/nginx/sites-available/gym-manager
# Cuando tenga dominio, reemplace este archivo por gym-manager.conf y ejecute:
#   sudo certbot --nginx -d su-dominio.com
# =====================================================================

limit_req_zone $binary_remote_addr zone=gym_api_http:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=gym_login_http:10m rate=1r/s;

upstream gym_api_http {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    server_tokens off;

    access_log /var/log/nginx/gym-manager.access.log;
    error_log  /var/log/nginx/gym-manager.error.log warn;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /var/www/gym-manager/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        limit_req zone=gym_api_http burst=20 nodelay;
        proxy_pass http://gym_api_http;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /api/auth/login {
        limit_req zone=gym_login_http burst=5 nodelay;
        proxy_pass http://gym_api_http;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /\. {
        deny all;
    }
}
