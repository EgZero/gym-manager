# =====================================================================
# GymManager · Nginx (servidor web + proxy inverso)
# Destino: /etc/nginx/sites-available/gym-manager
#   sudo ln -s /etc/nginx/sites-available/gym-manager /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reemplace __DOMINIO__ por su dominio (o la IP del VPS).
# El bloque TLS lo genera/gestiona certbot: sudo certbot --nginx -d __DOMINIO__
# =====================================================================

# Zonas de limitación de peticiones (defensa ante fuerza bruta y abuso)
limit_req_zone $binary_remote_addr zone=gym_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=gym_login:10m rate=1r/s;

upstream gym_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    # Certbot coloca aquí el desafío ACME antes de emitir el certificado
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Tras emitir el certificado, redirigir todo a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMINIO__;

    # --- TLS (rutas creadas por certbot) ------------------------------
    ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Cabeceras de seguridad (RNF-02) ------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # --- Logs ---------------------------------------------------------
    access_log /var/log/nginx/gym-manager.access.log;
    error_log  /var/log/nginx/gym-manager.error.log warn;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- SPA (archivos estáticos compilados por Vite) -----------------
    root /var/www/gym-manager/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash pueden cachearse de forma agresiva
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea: garantiza que el despliegue se vea de inmediato
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # --- API (proxy inverso al servidor de aplicaciones) --------------
    location /api/ {
        limit_req zone=gym_api burst=20 nodelay;
        proxy_pass http://gym_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Límite más estricto para el inicio de sesión (RNF-04)
    location = /api/auth/login {
        limit_req zone=gym_login burst=5 nodelay;
        proxy_pass http://gym_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://gym_api;
        proxy_set_header Host $host;
    }

    # Nunca servir archivos ocultos
    location ~ /\. {
        deny all;
    }
}
